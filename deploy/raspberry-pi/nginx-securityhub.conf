# /etc/nginx/snippets/securityhub.conf - include it in the server block that answers for your host name
# (the HTTPS one, if any):
#     include snippets/securityhub.conf;
# The portal describes the weaknesses of the organization: keep it behind authentication and,
# if possible, reachable only from the management network.
#
# The folder must be readable by the user nginx runs as (see 'user' in /etc/nginx/nginx.conf or
# 'ps -o user= -C nginx'): www-data on a standard install, nobody on some appliances (e.g. FruityWiFi).
# Give the folder that user's group: chown securityhub:<group> ... ; chmod 2750 ...
#
# ^~ : this prefix wins over regex locations of the site (e.g. "location ~ \.php$"), so nothing here is
#      ever passed to PHP. alias: works whatever the 'root' of the site is.
location ^~ /securityhub/ {
    alias /var/www/html/securityhub/;
    index index.html;
    autoindex off;

    # allow 192.168.1.0/24;   # management network
    # deny all;
    auth_basic "Security Hub";
    auth_basic_user_file /etc/nginx/securityhub.htpasswd;

    # always the latest run, never a cached copy
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # no Content-Security-Policy header here: the page carries its own, a second one would be combined with it

    location ~ /\. { deny all; }   # .tmp-* files written during an atomic update
}
