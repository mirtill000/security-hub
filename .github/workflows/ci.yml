name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # one failing version must not cancel the others: each result is useful on its own
      fail-fast: false
      matrix:
        include:
          # 3.9 = oldest supported (e.g. Raspberry Pi OS Bullseye); not available on Ubuntu 24.04 runners
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[full,dev]"
      - run: python -m pyflakes securityhub tests
      - run: python -m pytest -q
